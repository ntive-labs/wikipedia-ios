appId: org.wikimedia.wikipedia
name: Which Came First plays a full game on a day with only 3 events (recycled pairing)
tags:
  - wikigames
---
# The fixture server (run-wikigames-recycled.sh) serves only 3 usable On This
# Day events. Pre-port, the pairing loop exhausted the pool after question 2
# (question 2 used the synthesized blank fallback), produced fewer than 5
# questions, and fetchOrStartWhichCameFirstDailySession threw
# insufficientQuestions: the feed card was hidden and the game was unplayable.
# With the port (Android 4824d3a9f7) events are recycled from a copy of the
# pool (poolCopy[index % count] for event1, any different-year copy event as
# the partner fallback), so the day yields a full 5-question game.
- launchApp:
    clearState: true
    arguments:
      "-DidShowOnboarding5.3": "YES"
      "-WMFHideTipsForTesting": "YES"
      "-WMFSuppressActivityTabOnboardingForTesting": "YES"
      "-WMFSuppressGamesAnnouncementForTesting": "YES"
      "-WMFSuppressReadingChallengeAnnouncementForTesting": "YES"
      "-WMFWikimediaRestAPIBaseURLOverride": "http://localhost:8081/"
# A fresh feed fetch can be slow; nudge it with a pull-to-refresh if needed.
- extendedWaitUntil:
    visible: "Featured article"
    timeout: 45000
    optional: true
- runFlow:
    when:
      notVisible: "Featured article"
    commands:
      - swipe:
          start: 50%, 30%
          end: 50%, 70%
      - extendedWaitUntil:
          visible: "Featured article"
          timeout: 45000
# The daily-game availability check fails while the WMFData store is still
# initializing on a cold start, which removes the games group. Keep doing
# pull-to-refreshes at the feed top until the warm content-source pass
# re-creates it. With only 3 events this availability check passing at all
# is part of the fix under test (recycling fills all 5 questions).
- repeat:
    times: 8
    while:
      notVisible: "Games"
    commands:
      - swipe:
          start: 50%, 25%
          end: 50%, 75%
      - extendedWaitUntil:
          visible: "Games"
          timeout: 20000
          optional: true
- scrollUntilVisible:
    element:
      text: "Which came first?"
    timeout: 15000
    centerElement: true
- takeScreenshot: .maestro/screenshots/ios-wikigames-recycled-card
# Card -> splash screen.
- tapOn: "Play today's game"
- extendedWaitUntil:
    visible: "About this game"
    timeout: 15000
- takeScreenshot: .maestro/screenshots/ios-wikigames-recycled-menu
# Splash -> game. Question 1 must load instead of the error screen.
- tapOn: "Play today's game"
- extendedWaitUntil:
    visible: "Question 1 of 5"
    timeout: 15000
- assertNotVisible: "Something went wrong"
- takeScreenshot: .maestro/screenshots/ios-wikigames-recycled-q1
- tapOn:
    point: 50%, 43%
- extendedWaitUntil:
    visible: "Submit"
    timeout: 5000
- tapOn: "Submit"
- extendedWaitUntil:
    visible: "Next"
    timeout: 8000
- takeScreenshot: .maestro/screenshots/ios-wikigames-recycled-q1-revealed
- tapOn: "Next"

# ---- Questions 2-4: pool exhausted, every pair is recycled ----
- repeat:
    times: 3
    commands:
      - extendedWaitUntil:
          notVisible: "Next"
          timeout: 8000
      - assertNotVisible: "Something went wrong"
      - tapOn:
          point: 50%, 43%
      - extendedWaitUntil:
          visible: "Submit"
          timeout: 5000
      - tapOn: "Submit"
      - extendedWaitUntil:
          visible: "Next"
          timeout: 8000
      - tapOn: "Next"

# ---- Question 5: still a real recycled pair, no error, no blank card ----
- extendedWaitUntil:
    visible: "Question 5 of 5"
    timeout: 8000
- assertNotVisible: "Something went wrong"
- takeScreenshot: .maestro/screenshots/ios-wikigames-recycled-q5
- tapOn:
    point: 50%, 43%
- extendedWaitUntil:
    visible: "Submit"
    timeout: 5000
- tapOn: "Submit"
- extendedWaitUntil:
    visible: "See Results"
    timeout: 8000
- takeScreenshot: .maestro/screenshots/ios-wikigames-recycled-q5-revealed
- tapOn: "See Results"

# ---- Results: the 3-event day completed instead of being unavailable ----
- extendedWaitUntil:
    visible: "You scored.*"
    timeout: 15000
- assertVisible: "Articles from today's game"
- takeScreenshot: .maestro/screenshots/ios-wikigames-recycled-results
